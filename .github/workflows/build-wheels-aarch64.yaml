name: build-wheels-aarch64
on:
  push:
    branches:
      - wheel
    tags:
      - '*'
  workflow_dispatch:
env:
  KHG_IS_FOR_PYPI: 1
concurrency:
  group: build-wheels-aarch64-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build_wheels:
    name: ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm]
        python-version: ["cp38", "cp39", "cp310", "cp311", "cp312", "cp313", "cp314", "cp315"]
        manylinux: [manylinux2014]
    steps:
      - uses: actions/checkout@v4
      # CPython 3.8 is EOL and has been dropped upstream: the manylinux
      # images removed the interpreter on 2026-05-07 and cibuildwheel 4.0
      # removed support for building it.  The last combination that still
      # works is cibuildwheel 3.x plus a pinned pre-drop image (for linux).

      - name: Build wheels (cp38)
        if: matrix.python-version == 'cp38'
        uses: pypa/cibuildwheel@v3.4.1
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* cp36-* cp37-* pp* *-musllinux* *-manylinux_i686"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_ARCHS_LINUX: aarch64
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/${{ matrix.manylinux }}_aarch64

      - name: Build wheels
        if: matrix.python-version != 'cp38'
        uses: pypa/cibuildwheel@v4.3.2
        env:
          CIBW_BUILD: "${{ matrix.python-version}}-* "
          CIBW_SKIP: "cp27-* cp35-* cp36-* cp37-* pp* *-musllinux* *-manylinux_i686"
          CIBW_BUILD_VERBOSITY: 3
          CIBW_ARCHS_LINUX: aarch64
          CIBW_MANYLINUX_AARCH64_IMAGE: quay.io/pypa/${{ matrix.manylinux }}_aarch64

      - name: Display wheels
        shell: bash
        run: |
          ls -lh ./wheelhouse/
          unzip -l ./wheelhouse/*.whl

      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.python-version }}
          path: ./wheelhouse/*.whl
      - name: Publish wheels to PyPI
        shell: bash
        env:
          TWINE_USERNAME: ${{ secrets.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          # python3 on macOS runners is managed by Homebrew and cannot be
          # upgraded in place ("no RECORD file was found for pip"), so install
          # twine into a throwaway venv instead of the system environment.
          python3 -m venv "$RUNNER_TEMP/twine"
          "$RUNNER_TEMP/twine/bin/python" -m pip install -U pip wheel twine==5.0.0 setuptools
          "$RUNNER_TEMP/twine/bin/twine" upload --skip-existing ./wheelhouse/*.whl
