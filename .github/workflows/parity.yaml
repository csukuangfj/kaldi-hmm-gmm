# Runs the kaldi-parity tests inside the kaldi docker image
# (ghcr.io/<owner>/kaldi), following the method of
# test-github-actions/.github/workflows/test-kaldi.yaml and
# test-kaldi-torch.yaml: kaldi does not have to be installed on the runner;
# the image ships /opt/kaldi with all reference binaries on PATH.
#
# What runs:
#   tests/parity/parity_ivector.py  OnlineIvectorExtractor vs
#     apply-cmvn-online | splice-feats | transform-feats |
#     gmm-global-get-post | ivector-extract-online
#
# Model: the synthetic fixtures in tests/data/ivector/ (no model download
# needed; regenerate with tests/data/ivector/generate.py).  The test wav is a
# 1 s sine generated in-place so no audio needs to be committed.
name: parity

on:
  push:
    branches:
      - master
      - ivector
  workflow_dispatch:

jobs:
  parity:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "name=ghcr.io/${owner}/kaldi:latest" >> "$GITHUB_OUTPUT"

      # build-kaldi.yaml pushes this image. On a fresh push the two workflows run
      # in parallel, so retry the pull briefly until the image is available.
      - name: Pull the image (retry until build-kaldi pushes it)
        run: |
          image="${{ steps.image.outputs.name }}"
          for i in $(seq 1 30); do
            if docker pull "$image"; then
              echo "Pulled $image on attempt $i"; exit 0
            fi
            echo "Attempt $i: $image not ready yet, retrying in 20s..."
            sleep 20
          done
          echo "ERROR: could not pull $image"; exit 1

      # Runs inside the kaldi container.  Builds kaldi-hmm-gmm from this
      # checkout into a venv (the Debian 12 base is PEP 668 "externally
      # managed", so a venv avoids pip refusing system installs) and runs the
      # parity tests against /opt/kaldi.  The quoted heredoc (<<'...') is
      # passed verbatim to `bash -s` in the container, so no shell quoting
      # needs escaping.
      - name: Run parity tests inside the container
        run: |
          docker run --rm -i \
            -v "${{ github.workspace }}:/work" -w /work \
            ${{ steps.image.outputs.name }} bash -s <<'KALDI_PARITY'
            set -u

            echo "################ BASIC ################"
            echo "==== python3 ===="
            python3 --version
            which python3
            echo "==== kaldi ===="
            ls /opt/kaldi/src/ivectorbin/ivector-extract-online

            echo
            echo "################ INSTALL ################"
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3-pip python3-venv cmake g++ ninja-build git

            python3 -m venv /opt/venv
            . /opt/venv/bin/activate
            python -m pip install --upgrade pip

            function retry() {
              $* || (sleep 2 && $*) || (sleep 4 && $*) || (sleep 8 && $*)
            }

            echo "==== installing python packages ===="
            retry pip install numpy kaldi-native-io
            retry pip install .    # build kaldi_hmm_gmm from this checkout

            echo
            echo "################ TEST DATA ################"
            # 1 s 16 kHz mono sine wav; parity only needs valid audio
            python3 - <<'WAV'
            import math, struct, wave
            with wave.open("/tmp/test.wav", "wb") as w:
                w.setnchannels(1); w.setsampwidth(2); w.setframerate(16000)
                w.writeframes(b"".join(
                    struct.pack("<h", int(8000 * math.sin(2 * math.pi * 440 * t / 16000)))
                    for t in range(16000)))
            WAV
            ls -l /tmp/test.wav tests/data/ivector/

            echo
            echo "################ PARITY ################"
            fail=0

            echo "==== parity_ivector.py (synthetic fixtures) ===="
            # --kaldi-dir is auto-detected as /opt/kaldi/src inside the image
            if python3 tests/parity/parity_ivector.py \
                 --model-dir tests/data/ivector \
                 --config tests/data/ivector/mfcc.conf \
                 --wav /tmp/test.wav; then
              echo "OK      parity_ivector"
            else
              echo "FAILED  parity_ivector"
              fail=1
            fi

            echo
            if [ "$fail" -eq 0 ]; then
              echo "PARITY COMPLETE — all checks passed"
            else
              echo "PARITY COMPLETE — BUT SOME CHECKS FAILED"
              exit 1
            fi
          KALDI_PARITY
